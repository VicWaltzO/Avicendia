<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Avicendia — mapa semántico del proyecto</title><desc id="descripcion">Plataforma prevista de gestión y trazabilidad avícola. Ocho módulos distinguen conceptos documentados, capacidades planificadas y propuestas experimentales. No hay capacidades ejecutables verificadas. Las flechas representan relaciones conceptuales. Revisión humana autorizada antes de confirmar datos. Piloto todavía no ejecutado.</desc>
